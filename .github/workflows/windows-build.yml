name: TAPE//BREAK Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build physical VHS engine
        shell: pwsh
        run: cargo build --release --locked

      - name: Test physical VHS engine
        shell: pwsh
        run: cargo test --release --locked

      - name: Install Python packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials PyInstaller pytest numpy

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256" -OutFile "$env:RUNNER_TEMP\ffmpeg.sha256"
          $expectedHash = ((Get-Content "$env:RUNNER_TEMP\ffmpeg.sha256" -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash "$env:RUNNER_TEMP\ffmpeg.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) { throw "FFmpeg archive SHA-256 verification failed" }
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg archive did not contain ffmpeg.exe and ffprobe.exe" }
          New-Item -ItemType Directory -Force -Path "packaging\windows\bin" | Out-Null
          Copy-Item $ffmpeg.FullName "packaging\windows\bin\ffmpeg.exe"
          Copy-Item $ffprobe.FullName "packaging\windows\bin\ffprobe.exe"

      - name: Test desktop GUI and backend
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          VHSGUI_REQUIRE_BINARY: "1"
          VHSPHYS_BIN: ${{ github.workspace }}\target\release\vhsphys.exe
        run: |
          $env:PATH = "$PWD\packaging\windows\bin;$env:PATH"
          python -m compileall -q python/vhsgui
          python -m pytest python/tests/test_gui_backend.py python/tests/test_gui_standard.py python/tests/test_cli_standard.py python/tests/test_gui_app.py -q

      - name: Package desktop application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name "TAPE-BREAK" --paths "python" --collect-all PySide6 --collect-all vhsgui --add-binary "target\release\vhsphys.exe;." --add-binary "packaging\windows\bin\ffmpeg.exe;." --add-binary "packaging\windows\bin\ffprobe.exe;." packaging\windows\launcher.py
          if (-not (Test-Path "dist\TAPE-BREAK\TAPE-BREAK.exe")) { throw "PyInstaller did not produce TAPE-BREAK.exe" }
          if (-not (Test-Path "dist\TAPE-BREAK\vhsphys.exe")) { throw "The physical VHS engine was not bundled" }
          if (-not (Test-Path "dist\TAPE-BREAK\ffmpeg.exe")) { throw "FFmpeg was not bundled" }
          if (-not (Test-Path "dist\TAPE-BREAK\ffprobe.exe")) { throw "FFprobe was not bundled" }
          Copy-Item "LICENSE" "dist\TAPE-BREAK\LICENSE-vhs-phys.txt"
          Invoke-WebRequest -Uri "https://www.gnu.org/licenses/gpl-3.0.txt" -OutFile "dist\TAPE-BREAK\GPL-3.0-FFmpeg.txt"
          @"
          FFmpeg Windows static essentials build from Gyan Doshi.
          This FFmpeg executable is distributed as a separate program and is licensed under GPL-3.0-or-later.
          GPL licence text: GPL-3.0-FFmpeg.txt
          Build downloads and source information: https://www.gyan.dev/ffmpeg/builds/
          FFmpeg source code: https://github.com/FFmpeg/FFmpeg
          "@ | Set-Content -Encoding utf8 "dist\TAPE-BREAK\FFmpeg-SOURCE.txt"

      - name: Smoke test packaged desktop window
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & "dist\TAPE-BREAK\TAPE-BREAK.exe" --screenshot "dist\TAPE-BREAK-smoke.png"
          if ($LASTEXITCODE -ne 0) { throw "Packaged TAPE//BREAK window failed to launch" }
          if (-not (Test-Path "dist\TAPE-BREAK-smoke.png")) { throw "Packaged window did not produce its smoke-test screenshot" }

      - name: Smoke test bundled engine
        shell: pwsh
        run: |
          & "dist\TAPE-BREAK\vhsphys.exe" presets
          if ($LASTEXITCODE -ne 0) { throw "Bundled VHS engine smoke test failed" }
          & "dist\TAPE-BREAK\ffmpeg.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg smoke test failed" }
          & "dist\TAPE-BREAK\ffprobe.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFprobe smoke test failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\installer" | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "packaging\windows\TAPE-BREAK.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upload portable app and installer
        uses: actions/upload-artifact@v4
        with:
          name: TAPE-BREAK-Windows
          path: |
            dist/TAPE-BREAK/
            dist/installer/TAPE-BREAK-Setup.exe
          if-no-files-found: error
          retention-days: 14
